<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayDB | Acceso</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="auth-shell">
    <section class="auth-aside">
      <a class="auth-brand" href="index.html"><span>P</span> PlayDB</a>
      <div>
        <p class="auth-eyebrow">Tu archivo de historias</p>
        <h1>Vuelve a la escena.</h1>
        <p>Guarda el ritmo de tu catálogo y descubre algo nuevo cada vez que entras.</p>
      </div>
      <p class="auth-aside-note">Series · Películas · Novelas · Anime</p>
    </section>

    <section class="auth-container">
      <div class="auth-header">
        <p class="auth-eyebrow">Acceso a PlayDB</p>
        <h2 id="formTitle">Iniciar Sesión</h2>
      </div>

    <div id="alertContainer"></div>

    <form id="authForm">
      <div class="form-group hidden" id="nombreGroup">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" class="form-control" placeholder="Ej. Jennifer López">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Ingresar</button>
    </form>

    <div class="auth-footer">
      <p id="toggleText">
        ¿No tienes cuenta? <a href="#" id="toggleAuth">Regístrate aquí</a>
      </p>
    </div>

      <a href="index.html" class="back-home">← Volver al catálogo público</a>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
