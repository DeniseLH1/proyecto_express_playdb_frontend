<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayDB | Tus Programas y Series</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/theme.css">
</head>
<body>

  <!-- Encabezado / Navegación Único -->
  <header class="navbar">
    <div class="logo">
      <h1>PlayDB 🎬</h1>
    </div>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar por título, categoría o actor...">
      <button id="searchBtn" class="btn btn-primary">Buscar</button>
    </div>

    <nav class="nav-links">
      <span id="userGreeting" class="hidden"></span>
      <a id="adminBtn" href="admin.html" class="btn btn-secondary hidden">Panel Admin</a>
      <button id="loginModalBtn" class="btn btn-primary">Iniciar Sesión</button>
      <button id="logoutBtn" class="btn btn-secondary hidden">Cerrar Sesión</button>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main class="container">
    <section class="filters-section">
      <h2>Catálogo de Programas</h2>
      <select id="categoryFilter">
        <option value="">Todas las categorías</option>
        <option value="Novelas">Novelas</option>
        <option value="Películas">Películas</option>
        <option value="Series">Series</option>
        <option value="Anime">Anime</option>
      </select>
    </section>

    <!-- Grid donde se renderizan las cards dinámicamente -->
    <section id="catalogGrid" class="catalog-grid">
      <p class="loading-text">Cargando catálogo...</p>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
